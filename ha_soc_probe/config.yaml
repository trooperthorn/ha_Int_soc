name: HA SOC Probe
version: "2026.09.16.2"
slug: ha_soc_probe
description: >-
  Optional host-level companion for the HA SOC integration. Reports the
  real listening TCP ports, can expose opt-in SNMPv3 AuthPriv telemetry,
  and can read and (opt-in, per proposed change) write the host's firewall
  rules on HA SOC's behalf. These are things a Python integration
  structurally cannot do from inside its own container, even on Home
  Assistant OS.
url: https://github.com/trooperthorn/ha_Int_soc
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
# NET_ADMIN: a real CAP_NET_ADMIN is the only way to run iptables against the host tables; see docs/security.md.
privileged:
  - NET_ADMIN
# docker_api: optional resource hard caps; it sets the Supervisor rating to 1 unconditionally, see docs/security.md.
docker_api: true
options:
  scan_interval_hours: 6
  # Netscan defaults; the owner-controlled enabled flag, port list, and
  # concurrency cap actually in force come from HA SOC's poll_netscan_config
  # service, the same pattern SNMP and firewall already use (see
  # ha_soc_probe_netscan/run). No new "privileged:" entry: TCP-connect and
  # /proc/net/arp need nothing beyond what the Probe already has.
  netscan_enabled: false
  netscan_port_list:
    - 22
    - 23
    - 80
    - 443
    - 445
    - 3389
    - 8080
    - 8443
  netscan_max_concurrency: 32
schema:
  scan_interval_hours: int(1,24)
  netscan_enabled: bool
  netscan_port_list:
    - int(1,65535)
  netscan_max_concurrency: int(1,128)
