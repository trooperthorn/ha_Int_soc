name: HA SOC Probe
version: "2026.08.30.2"
slug: ha_soc_probe
description: >-
  Optional host-level companion for the HA SOC integration. Reports the
  real listening TCP ports on the Home Assistant host, and — since this
  release — can read and (opt-in, per proposed change) write the host's
  firewall rules on HA SOC's behalf. Both are things a Python integration
  structurally cannot do from inside its own container, even on Home
  Assistant OS.
url: https://github.com/trooperthorn/ha_Int_soc
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
# NET_ADMIN is required for the firewall read/write feature — a real
# CAP_NET_ADMIN is the only way a container can run iptables against the
# host's actual netfilter tables, Protection Mode or not (see the HA SOC
# integration's README for the full Supervisor security-rating breakdown
# this incurs — a documented, deliberate -1). Every rule this add-on ever
# applies lives in its own dedicated iptables chain (HA_SOC_RULES); it
# never touches the raw INPUT chain or anything Docker itself manages.
privileged:
  - NET_ADMIN
# docker_api maps the Docker socket for the OPTIONAL resource hard-cap
# feature (per-add-on --memory/--cpus, configured owner-only in the HA SOC
# panel). With Protection Mode ON (the default) the socket is read-only and
# every cap application honestly reports "denied" — actually applying caps
# requires the user to deliberately disable Protection Mode on THIS add-on,
# a root-equivalent grant the panel spells out before anything is applied.
# Users who don't use hard caps lose nothing by leaving Protection Mode on.
docker_api: true
options:
  scan_interval_hours: 6
schema:
  scan_interval_hours: int(1,24)
