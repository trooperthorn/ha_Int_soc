name: HA SOC Probe
version: "0.1.0"
slug: ha_soc_probe
description: >-
  Optional host-level companion for the HA SOC integration. Reports the
  real listening TCP ports on the Home Assistant host — the one thing a
  Python integration structurally cannot see from inside its own
  container, even on Home Assistant OS.
url: https://github.com/trooperthorn/ha_int_soc
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
options:
  scan_interval_hours: 6
schema:
  scan_interval_hours: int(1,24)
