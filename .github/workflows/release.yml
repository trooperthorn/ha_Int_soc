# Turns every pushed version tag into a GitHub Release that HACS installs
# from. Guards that the tag and the integration manifest version agree, so
# the two can never drift apart again (the drift is what caused HACS to
# quote a version that matched no release and fail with an unresolved
# domain). Uses the preinstalled `gh` CLI with the built-in GITHUB_TOKEN, so
# the only third-party action in the release path is the pinned checkout.
name: Release

on:
  push:
    tags:
      # vYYYY.MM.DD.N, the project's canonical release-tag form. Only the
      # v-prefixed pattern triggers on purpose: a bare tag for the same
      # version would otherwise create a second Release, and HACS installs
      # by tag name, so one version must never exist as two tags.
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"

# Creating a GitHub Release requires contents: write. The called test
# workflow narrows its own jobs to contents: read below, so only the release
# job itself holds the write scope.
permissions:
  contents: write

jobs:
  # The pytest suite and the bundle drift check must pass before a Release
  # is created, so a tag pushed from a broken tree cannot ship (work plan
  # item 0.6, CI-1). Calling test.yml reuses the exact jobs that gate every
  # push and pull request instead of keeping a copy that could drift.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA so a moved or compromised tag cannot change the
      # code this workflow runs; the digest was resolved from github.com on
      # 2026-08-30 and matched the tag in the trailing comment at that time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (v4)

      - name: Verify the tag matches the manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('custom_components/ha_soc/manifest.json'))['version'])")
          echo "tag=$TAG  manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag ($TAG) != manifest version ($MANIFEST). Use scripts/release.sh so they always match."
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; treating this rerun as complete."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
