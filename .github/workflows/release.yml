# Turns every pushed version tag into a GitHub Release that HACS installs
# from. Guards that the tag, integration manifest, Probe add-on, and Probe
# scanner versions agree, so shipped component identifiers cannot drift.
# Uses the preinstalled `gh` CLI with the built-in GITHUB_TOKEN, so the only
# third-party action in the release path is the pinned checkout.
name: Release

on:
  push:
    tags:
      # vYYYY.MM.DD.N, the project's canonical release-tag form. Only the
      # v-prefixed pattern triggers on purpose: a bare tag for the same
      # version would otherwise create a second Release, and HACS installs
      # by tag name, so one version must never exist as two tags.
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"

# Creating a GitHub Release requires contents: write. The called test
# workflow narrows its own jobs to contents: read below, so only the release
# job itself holds the write scope.
permissions:
  contents: write

jobs:
  # The pytest suite and the bundle drift check must pass before a Release
  # is created, so a tag pushed from a broken tree cannot ship (work plan
  # item 0.6, CI-1). Calling test.yml reuses the exact jobs that gate every
  # push and pull request instead of keeping a copy that could drift.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA so a moved or compromised tag cannot change the
      # code this workflow runs; the matching release is documented in the
      # trailing comment and is reviewed when Dependabot updates the digest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag matches every component version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          python3 - "$TAG" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          expected = sys.argv[1]
          manifest = json.loads(
              Path("custom_components/ha_soc/manifest.json").read_text(encoding="utf-8")
          )["version"]
          probe_text = Path("ha_soc_probe/config.yaml").read_text(encoding="utf-8")
          scanner_text = Path(
              "ha_soc_probe/rootfs/etc/services.d/ha_soc_probe/run"
          ).read_text(encoding="utf-8")
          probe_match = re.search(r'^version:\s*"([^"]+)"', probe_text, re.MULTILINE)
          scanner_match = re.search(
              r'^SCANNER_VERSION="([^"]+)"', scanner_text, re.MULTILINE
          )
          versions = {
              "tag": expected,
              "manifest": manifest,
              "probe": probe_match.group(1) if probe_match else "<missing>",
              "scanner": scanner_match.group(1) if scanner_match else "<missing>",
          }
          print("  ".join(f"{name}={value}" for name, value in versions.items()))
          mismatched = {name: value for name, value in versions.items() if value != expected}
          if mismatched:
              sys.exit(
                  "Version mismatch: "
                  + ", ".join(f"{name}={value}" for name, value in mismatched.items())
                  + ". Use scripts/release.sh so every component stays in lockstep."
              )
          PY

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; treating this rerun as complete."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
