name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CodeQL's floating v4 tag is resolved to an immutable commit. Both
      # languages use the action's no-build analysis because this repository
      # contains interpreted Python and TypeScript compiled only for its
      # checked-in browser bundle.
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"

  python-security:
    name: Python static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned scanner
        run: pip install "bandit==1.8.6"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Bandit medium/high findings
        # B104 flags the intentionally all-interface probe listener. The
        # add-on firewall and authenticated request boundary are its controls.
        run: bandit -q -r custom_components/ha_soc -ll -s B104

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/ha_soc/frontend/package-lock.json
      - working-directory: custom_components/ha_soc/frontend
        run: npm ci
      - working-directory: custom_components/ha_soc/frontend
        run: npm audit --audit-level=moderate

  shell-security:
    name: ShellCheck probe boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell programs
        # s6-overlay uses a with-contenv shebang, so declare its underlying
        # shell explicitly. The add-on's absolute /usr/lib source exists in
        # the image rather than the checkout; the helper is checked directly.
        run: find ha_soc_probe/rootfs -type f \( -name '*.sh' -o -path '*/services.d/*/run' \) -print0 | xargs -0 shellcheck --shell=bash --exclude=SC1091

  probe-image-security:
    name: Probe image build and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the actual Probe image
        run: docker build --tag local/ha-soc-probe:${{ github.sha }} ha_soc_probe
      - name: Verify the minimal SNMP runtime
        run: |
          docker run --rm --entrypoint /bin/sh local/ha-soc-probe:${{ github.sha }} -c 'snmpd --version >/dev/null'
          docker run --rm --entrypoint /bin/sh local/ha-soc-probe:${{ github.sha }} -c '! command -v snmpset'
          docker run --rm --entrypoint /bin/sh local/ha-soc-probe:${{ github.sha }} -c '! command -v tempio'
          docker run --rm --entrypoint /bin/sh local/ha-soc-probe:${{ github.sha }} -c 'id ha_soc_snmp >/dev/null'
      # Pinned to the immutable commit behind scan-action v7.4.0. The
      # scanner runs with this workflow's read-only token and a pinned
      # Grype version; HIGH/CRITICAL findings fail the pull request.
      - name: Scan installed OS packages
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/ha-soc-probe:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          grype-version: v0.110.0
