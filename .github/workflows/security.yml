name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    name: Python static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pinned scanner
        run: pip install "bandit==1.8.6"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Bandit medium/high findings
        # B104 flags the intentionally all-interface probe listener. The
        # add-on firewall and authenticated request boundary are its controls.
        run: bandit -q -r custom_components/ha_soc -ll -s B104

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/ha_soc/frontend/package-lock.json
      - working-directory: custom_components/ha_soc/frontend
        run: npm ci
      - working-directory: custom_components/ha_soc/frontend
        run: npm audit --audit-level=moderate

  shell-security:
    name: ShellCheck probe boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell programs
        # s6-overlay uses a with-contenv shebang, so declare its underlying
        # shell explicitly. The add-on's absolute /usr/lib source exists in
        # the image rather than the checkout; the helper is checked directly.
        run: find ha_soc_probe/rootfs -type f \( -name '*.sh' -o -path '*/services.d/*/run' \) -print0 | xargs -0 shellcheck --shell=bash --exclude=SC1091
