# HACS and hassfest validation, so a manifest or hacs.json HACS cannot install fails before a release is cut.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches drift from HACS requirement changes

# Read-only token: validation only reads the repository.
permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA; the trailing comment names the matching release or ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hacs/action publishes no tags after 22.5.0; the pin is head of main, bumped when the weekly run fails.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main on 2026-08-30
        with:
          category: integration

  hassfest:
    name: hassfest (manifest sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hassfest publishes no release tags; the pin is head of master.
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master on 2026-08-30
