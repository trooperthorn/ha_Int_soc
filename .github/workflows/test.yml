# pytest suite and frontend bundle drift check; release.yml calls this workflow as its release gate.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  # workflow_call lets release.yml reuse these exact jobs.
  workflow_call:

# Read-only token: the jobs only read the repository.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA; the trailing comment names the matching release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      # Pins live in requirements-test.txt; the home-assistant-frontend pin must match the harness core's package_constraints.txt.
      - name: Install the test harness
        run: pip install -r requirements-test.txt
      # The harness pins the core beta it was extracted from; the stable
      # core is pinned separately so the suite runs against the release.
      - name: Pin the stable core over the harness
        run: pip install -r requirements-core.txt
      - name: Run the suite
        run: pytest tests/ -q

  bundle-drift:
    name: Frontend bundle matches source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # package.json declares no engines constraint; Node 22 is the line the committed bundle rebuilds byte-for-byte under.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/ha_soc/frontend/package-lock.json
      # HACS serves the committed dist/ bundle, so any drift from source fails here.
      - name: Rebuild the bundle and fail on drift
        run: |
          cd custom_components/ha_soc/frontend
          npm ci
          npm run build
          git diff --exit-code dist/
