version: 2
updates:
  - package-ecosystem: npm
    directory: /custom_components/ha_soc/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The harness pins its core exactly; they only resolve together. The
      # frontend pin must equal the line in that core's package_constraints.txt.
      home-assistant:
        patterns:
          - homeassistant
          - pytest-homeassistant
          - home-assistant-frontend

