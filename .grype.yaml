# Grype ignore rules for the image scans in .github/workflows/security.yml.
# Every entry is scoped to one file and one advisory and carries the date and
# the reason; an entry with no reason is a lowered gate. See docs/decisions.md.
ignore:
  # 2026-09-11: the Supervisor CLI (home-assistant/cli 5.5.0, the newest
  # release) is a static Go binary carrying golang.org/x/net and x/text at
  # versions with fixed advisories. It is a client that only ever talks to
  # http://supervisor on the internal network, run interactively by the
  # session owner. Remove both entries when a CLI release ships newer
  # modules (backlog.md).
  - vulnerability: GO-2026-5942
    package:
      name: golang.org/x/net
      location: /usr/bin/ha.real
  - vulnerability: GO-2026-5970
    package:
      name: golang.org/x/text
      location: /usr/bin/ha.real
  # 2026-09-22: zlib 1.3.2-r0 in the Alpine 3.24 base image is flagged High
  # for CVE-2026-85091 and no Alpine branch, edge included, ships a fixed
  # package (checked against the 3.23, 3.24 and edge APKINDEX and the 3.24
  # secdb that day). apk upgrade in both Dockerfiles picks the fix up the
  # day it is published; until then this entry keeps the gate honest for
  # every other advisory. Review on the next base-image bump (backlog.md).
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
  # 2026-09-26: net-snmp 5.9.5.2-r0 is flagged High for CVE-2026-89147, a
  # denial of service in the SMUX subagent module: smux_accept() does a
  # blocking read on a newly accepted TCP connection before its timeout is
  # installed, so a client that connects to the SMUX listener and sends
  # nothing stalls snmpd's main loop (net-snmp/net-snmp#1134, CVSS 7.5, no
  # code execution or data exposure). The path is reachable only through
  # the SMUX listener, TCP 199. The Probe's snmpd.conf sets agentAddress
  # only and never smuxsocket, and on the live install snmpd listens on
  # UDP 161 alone (netstat, 2026-09-26). No Alpine 3.24 or edge build
  # carries a fix; apk upgrade picks it up when one ships. Scoped to the
  # three net-snmp packages in the Probe image only. Review when Alpine
  # publishes a newer net-snmp or if the SNMP service ever gains a SMUX
  # or AgentX listener (backlog.md).
  - vulnerability: CVE-2026-89147
    package:
      name: net-snmp
  - vulnerability: CVE-2026-89147
    package:
      name: net-snmp-agent-libs
  - vulnerability: CVE-2026-89147
    package:
      name: net-snmp-libs
