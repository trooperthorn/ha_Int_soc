configuration:
  session_recording:
    name: Record sessions
    description: >-
      Write every terminal session to a transcript with timing under the
      app's data directory and record its hash. On by default; the panel
      shows the state in the terminal header.
  history_persist:
    name: Keep shell history
    description: >-
      Keep bash history across restarts and updates of the app, with a
      timestamp on every line.
  idle_timeout_minutes:
    name: Idle timeout (minutes)
    description: >-
      Close a shell that has sat at its prompt for this long. 0 disables the
      timeout. A running program is not interrupted.
  sftp_enabled:
    name: SFTP server
    description: >-
      Start the SFTP server for file transfer to the configuration directory
      (key authentication only, no shell). A host port must also be mapped to
      container port 2222 under Network.
  sftp_authorized_keys:
    name: SFTP authorized keys
    description: >-
      Public keys allowed to log in for SFTP, one per entry, in
      authorized_keys line form (for example "ssh-ed25519 AAAA... name").
