[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Home Assistant must install its httpx alias before respx is imported; the harness
# still uses respx directly, only the separate pytest plugin is off.
addopts = -p no:respx
pythonpath = .
testpaths = tests
markers =
    isolated_config_dir: run the test with a private Home Assistant config directory
