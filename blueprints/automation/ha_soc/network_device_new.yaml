blueprint:
  name: HA SOC new network device
  description: >-
    Send a notification when HA SOC records a network device it has not seen
    before. Needs "Fire events for automations" turned on in the HA SOC panel,
    under Assets, Network Devices. The message names the device by your label
    when it has one, otherwise by its inventory id; open the panel to see what
    it is.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_Int_soc/blob/main/blueprints/automation/ha_soc/network_device_new.yaml
  author: HA SOC
  input:
    notify_device:
      name: Device to notify
      description: Device needs to run the official Home Assistant app to receive notifications.
      selector:
        device:
          filter:
            integration: mobile_app

triggers:
  trigger: event
  event_type: ha_soc_network_device_new

variables:
  device_name: "{{ trigger.event.data.label or trigger.event.data.device_id }}"

actions:
  - alias: "Notify that a new network device was recorded"
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    message: "New device on the network: {{ device_name }}"
